model:
  name: net-v1
  config:
    bev_channels: 5
    max_horizon: 320
    dt: 0.2
    hidden_dim: 128
data:
  train: ../../data/task_dataset/tracked_pivot_v7_3000/train.npz
  val: ../../data/task_dataset/tracked_pivot_v7_3000/val.npz
  batch_size: 8
training:
  epochs: 30
  learning_rate: 0.001
  patience: 5
  min_delta: 0.0
  device: cpu
  stop_loss_weight: 0.2
  seed: 20260827
  shuffle_train: true
  balance_stop_loss: true
  teacher_forcing_start: 1.0
  teacher_forcing_end: 0.2
  teacher_forcing_decay_epochs: 15
output:
  directory: ../../runs/training/v7-flow-v2/net-v1
