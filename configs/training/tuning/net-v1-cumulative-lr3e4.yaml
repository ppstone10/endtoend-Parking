model:
  name: net-v1
  config:
    bev_channels: 5
    max_horizon: 320
    dt: 0.2
    hidden_dim: 128
data:
  train: ../../../data/task_dataset/tracked_pivot_v7_3000/train.npz
  val: ../../../data/task_dataset/tracked_pivot_v7_3000/val.npz
  batch_size: 8
training:
  epochs: 4
  learning_rate: 0.0003
  patience: 4
  min_delta: 0.0
  device: cpu
  stop_loss_weight: 0.2
  seed: 20260827
  shuffle_train: true
  balance_stop_loss: false
  stop_target_mode: cumulative
  teacher_forcing_start: 1.0
  teacher_forcing_end: 0.2
  teacher_forcing_decay_epochs: 15
  early_stopping_start_epoch: 3
output:
  directory: ../../../runs/training/tuning-v7/net-v1-cumulative-lr3e4
