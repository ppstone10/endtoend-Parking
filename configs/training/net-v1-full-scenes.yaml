model:
  name: net-v1
  config:
    bev_channels: 5
    max_horizon: 320
    dt: 0.2
    hidden_dim: 128
    target_channel: geometry
    height_mode: semantic
data:
  train: ../../data/task_dataset/tracked_pivot_v8_3000/train.npz
  val: ../../data/task_dataset/tracked_pivot_v8_3000/val.npz
  batch_size: 8
training:
  epochs: 30
  learning_rate: 0.0003
  patience: 5
  min_delta: 0.0
  device: cpu
  stop_loss_weight: 0.2
  seed: 20260827
  shuffle_train: true
  balance_stop_loss: false
  stop_target_mode: cumulative
  teacher_forcing_start: 1.0
  teacher_forcing_end: 0.2
  teacher_forcing_decay_epochs: 15
  early_stopping_start_epoch: 15
output:
  directory: ../../runs/training/v13-full-scenes/net-v1
