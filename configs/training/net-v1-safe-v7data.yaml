model:
  name: net-v1
  config:
    bev_channels: 5
    max_horizon: 320
    dt: 0.2
    hidden_dim: 128
data:
  train: ../../data/task_dataset/tracked_pivot_v7_3000/train.npz
  val: ../../data/task_dataset/tracked_pivot_v7_3000/val.npz
  batch_size: 8
training:
  epochs: 15
  learning_rate: 0.0003
  patience: 5
  min_delta: 0.0
  device: cpu
  stop_loss_weight: 0.2
  collision_loss_weight: 0.5
  safety_extra_margin_m: 0.1
  safety_sample_spacing_m: 0.5
  safety_max_swept_substeps: 16
  safety_out_of_bounds_weight: 1.0
  safety_loss_mode: clearance_field
  balance_recovery_batches: false
  seed: 20260830
  shuffle_train: true
  balance_stop_loss: false
  stop_target_mode: cumulative
  teacher_forcing_start: 0.2
  teacher_forcing_end: 0.2
  teacher_forcing_decay_epochs: 1
  early_stopping_start_epoch: 3
output:
  directory: ../../runs/training/v9d-v7data/net-v1
initialize_from: ../../runs/training/v7-flow-v3/net-v1/best.pt