# LT31同起点/同剂量配对；只改变终点保持训练策略。原生last为主，非闭环资格。
model:
  name: net-v1
  config:
    bev_channels: 5
    max_horizon: 320
    dt: 0.2
    hidden_dim: 128
    stop_threshold: 0.5
    target_channel: image
    height_mode: semantic
    camera_projection: per_view_v2
data:
  train: ../../runs/verification/surround-target-rebuild-lineage-20261027/train/train-balanced.npz
  val: ../../runs/verification/surround-target-rebuild-lineage-20261027/val/val.npz
  batch_size: 8
training:
  epochs: 4
  learning_rate: 1.0e-05
  patience: 4
  min_delta: 0.0
  device: cpu
  gradient_clip_norm: 1.0
  stop_loss_weight: 0.2
  endpoint_alignment_weight: 0.5
  endpoint_alignment_tail_points: 8
  terminal_pose_weight: 1.0
  terminal_yaw_weight: 10.0
  collision_loss_weight: 0.0
  balance_recovery_batches: false
  seed: 20260827
  shuffle_train: true
  balance_stop_loss: false
  stop_target_mode: cumulative
  teacher_forcing_start: 0.2
  teacher_forcing_end: 0.2
  teacher_forcing_decay_epochs: 1
  early_stopping_start_epoch: 0
  terminal_hold_weight: 0.0
output:
  directory: ../../runs/training/lt31-terminal-hold-20261027/control
initialize_from: ../../runs/training/lt30-surround-input-20261027/per-view/last.pt
